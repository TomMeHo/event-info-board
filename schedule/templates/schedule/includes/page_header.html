{% load static %}
<div class="container">
    <div class="row align-items-center">
        <div class="col-auto">
            <img src="{% static 'dm2026.png' %}" class="d-none d-md-inline" width=100>
            <img src="{% static 'dm2026.png' %}" class="d-md-none" width=60>
        </div>
        <div class="col text-center align-middle">
            <h1 class="title 1">{% if event %}{{ event.title }}{% else %}Kein Wettkampf ausgewählt{% endif %}</h1>
        </div>
        <div class="col-auto text-end d-none d-md-block">
            <img src="{% static 'djjb.png' %}" width=100>
        </div>
    </div>
</div>

<nav class="navbar sticky-top bg-body-tertiary border-bottom border-secondary-subtle mb-3">
    <div class="container">
        <ul class="nav nav-pills">
            <li class="nav-item">
                <a class="nav-link {% if request.resolver_match.url_name == 'schedule_compact' or request.resolver_match.url_name == 'slot_detail' %}active{% endif %}"
                   href="{% url 'schedule_compact' %}">Zeitplan</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.resolver_match.url_name == 'registrations_list' or request.resolver_match.url_name == 'registration_detail' %}active{% endif %}"
                   href="{% url 'registrations_list' %}">Teilnehmerliste</a>
            </li>
        </ul>
    </div>
</nav>
